name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish src/WorkspaceManager -c Release -o publish

      - name: Zip
        run: Compress-Archive -Path publish/* -DestinationPath WorkspaceManager-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: WorkspaceManager-win-x64
          path: WorkspaceManager-win-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WorkspaceManager-win-x64
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" WorkspaceManager-win-x64.zip --repo "$GITHUB_REPOSITORY" --generate-notes
